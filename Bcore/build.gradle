apply plugin: 'com.android.library'

android {
    namespace 'top.niunaijun.blackbox'

    /*
     * 这里**刻意**不用 rootProject.ext.compileSdkVersion（工程主值是 37），
     * 而是保持原版的 35。
     *
     * 原因不是保守，是必须：Bcore 引用了 Context.FINGERPRINT_SERVICE，
     * 该常量在 API 35/36 的 android.jar 里还在，到 API 37 已被移除，
     * 用 37 编译会直接 cannot find symbol。原版能编过正因为它用的是 35。
     */
    compileSdk 35

    /*
     * 这几个 AIDL 是**框架私有**接口的本地副本（android/app/IServiceConnection.aidl 等）。
     * aidlPackagedList 让 AGP 把它们当作"随包发布"的声明，从而与本模块自己的 AIDL
     * 一起被引用，而不是去 framework.aidl 里找。
     */
    aidlPackagedList = [
        "android/app/IServiceConnection.aidl",
        "android/accounts/IAccountManagerResponse.aidl",
    ]

    buildFeatures {
        aidl true
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdk

        consumerProguardFiles "consumer-rules.pro"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            /*
             * 与 app 一致地开 R8（用户要求「全局开 R8」）。
             *
             * 这个模块的收益比 app 小 —— `Bcore/proguard-rules.pro` 把
             * `top.niunaijun.blackbox.**` 与 `mirror.**` 整包 keep 住了
             * （那是注解驱动反射的要求，见该文件），所以自己的类不会被改名或裁掉。
             * 能压掉的是跟着进来的第三方（toml4j、FreeReflection、androidx.core）
             * 里没人用到的部分。
             *
             * ⚠️ 库模块开 minify 是**先于使用方**发生的：R8 在 Bcore 自己的
             * 变体上先跑一遍，产出的类再由 app 的 R8 处理。所以这里能看到的
             * 「谁被用到」只有 Bcore 自己 —— 只靠 app 侧规则保不住的东西，
             * 必须在**本模块**的 proguard-rules.pro（自己的构建）或
             * consumer-rules.pro（导出给使用方）里声明。两者分工别搞混。
             *
             * 另一个必然后果：本模块的 R8 拿编译期 android.jar 当参照，
             * 而 Bcore 要 hook 的正是 android.jar 里**不存在**的那些类
             * （ActivityThread、ServiceManager、dalvik.system.* 等）。
             * 具体 drop 的 -dontwarn 见 proguard-rules.pro 第 5 节。
             */
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    /*
     * 原版在这里走 ndk-build 现场编译 libblackbox.so。
     *
     * 本工程**故意不走原生编译**：内置 Termux 的宿主是 aarch64 (arm64)，
     * 而 Android NDK 只发布 linux-x86_64 的宿主工具链，
     * ndk-build 一开始就报 "Unknown host CPU architecture: aarch64" 退出，
     * 在没有 x86_64 用户空间的情况下无法绕过。
     *
     * 因此改为直接使用**同一份源码**产出的预编译库
     * （Bcore/src/main/jniLibs/arm64-v8a/libblackbox.so，AARCH64 ELF，
     *   内含 JNI_OnLoad 与 top/niunaijun/blackbox/core/NativeCore）。
     * 这样 Java 侧照常 System.loadLibrary("blackbox")，行为与原版一致；
     * 需要重新编译原生库时，请在具备 x86_64 宿主的环境执行 ndk-build，替换该 .so。
     */

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-unchecked" << "-Xlint:-rawtypes"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
    }
}

// Strip the AIDL-generated "Using: ..." comment line which contains backslash sequences
// that Java's compiler mis-parses as Unicode escapes on Windows paths.
// Resolve the generated-source directory during configuration. Referencing the
// Groovy script's buildDir from a task action breaks Gradle configuration cache.
def aidlOut = layout.buildDirectory.dir("generated/aidl_source_output_dir").get().asFile

tasks.matching { it.name.startsWith('compileReleaseJavaWithJavac') || it.name.startsWith('compileDebugJavaWithJavac') }.all {
    doFirst {
        if (aidlOut.exists()) {
            aidlOut.eachFileRecurse { f ->
                if (f.name.endsWith('.java')) {
                    def content = f.text
                    if (content.contains(' * Using:')) {
                        content = content.replaceAll(/(?m)^ \* Using:.*$/, '')
                        f.text = content
                    }
                }
            }
        }
    }
}

dependencies {
    implementation(project(":black-reflection"))
    annotationProcessor(project(":compiler"))
    implementation 'androidx.core:core:1.15.0'

    implementation 'com.moandjiezana.toml:toml4j:0.7.2'

    implementation 'com.github.tiann:FreeReflection:3.2.2'
}
