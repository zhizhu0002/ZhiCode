import com.android.build.api.variant.ApplicationAndroidComponentsExtension

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.zhizhu.zhicode.compose'
    compileSdk 37

    defaultConfig {
        /*
         * ⚠️ 已知限制：这个 applicationId 会让**内置 Termux 运行时无法安装**。
         *
         * 原因是长度对不上，而且没有绕法：
         *
         *   内置 Termux bootstrap 里有 337 个 ELF 二进制把前缀 "/data/data/com.termux"
         *   （21 字符）编译进了字符串表。安装时必须把它**原地**改写成
         *   "/data/user/0/<包名>"。ELF 字符串表按偏移定位，替换串只要差一个字节，
         *   后面所有偏移全部错位，二进制即损坏。所以必须满足
         *       13 + len(applicationId) == 21  →  len(applicationId) == 8
         *
         *   "com.zhizhu.zhicode" 是 18 字符 → "/data/user/0/com.zhizhu.zhicode" 是 31 字符。
         *   RuntimeInstaller 会**明确报错**（不会静默产出损坏文件）：
         *     - ensureSafePrefixRewrite() 旧/新前缀长度不等 → IllegalStateException
         *     - replaceAllInPlace() 对每个 bootstrap 文件再次校验 → IllegalStateException
         *
         * 后果：应用可编译、可安装、可启动，但"安装内置 Termux 环境"这一步必然失败。
         *   不可用：终端页、Bash/RootBash、GitStatus、Delete、Enter/ExitWorktree、
         *           TermuxDoctor/TermuxRepair、pkg install、沙箱 Termux 桥
         *   仍可用：模型对话、会话、设置/API/MCP/技能/角色卡/记忆、
         *           Read/Write/Edit/Glob/Grep/Stat/Mkdir/Move/List/Copy、
         *           文件与变更面板、AndroidIntent、剪贴板、/web 联网
         *
         * 要同时保住运行时与品牌名，只有两条路：
         *   1) 换成等长的 8 字符 applicationId（如 "zhi.code" → /data/user/0/zhi.code = 21）；
         *   2) 离线重写那 337 个 ELF 的字符串表（重算 section 偏移与 RIP 相对引用）——
         *      属于独立工程，且需要 x86_64 宿主才能验证（本机 aarch64，NDK 跑不起来）。
         *
         * 这不是设计疏漏，是**有意接受的取舍**，写在这里以免后人误以为是配置错误。
         */
        applicationId 'com.zhizhu.zhicode'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '0.2'

        // 内置 Termux 只提供 arm64 用户空间
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 开启 BuildConfig：包名的**唯一真实来源**就是上面的 applicationId，
    // 代码里（TermuxConstants 的兜底值等）一律引用 BuildConfig.APPLICATION_ID，
    // 不再各自抄一份字符串。下次换包名只需改这一行。
    buildFeatures {
        compose true
        buildConfig true
    }

    // 解压后的 libtermux.so 要用绝对路径 System.load，必须按传统方式打进 APK
    packagingOptions {
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['META-INF/*.kotlin_module'] }
    }

    // bootstrap-aarch64.zip 不能被压缩：一是包体巨大，二是要按 32MB 原样读进 assets
    androidResources { noCompress 'zip' }

    lint { abortOnError false; checkReleaseBuilds false }
}

// AGP 9 移除了 applicationVariants，改用 androidComponents API 定制输出文件名
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("ZhiCode-${variant.name}.apk")
        }
    }
}

dependencies {
    // IQ 沙箱（BlackBox 虚拟 Android 运行时宿主）—— Phase 7
    implementation project(':Bcore')
    implementation 'androidx.activity:activity-compose:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-core:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-icons:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-shader:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-squircle:0.9.4'
    // 模糊效果：独立 artifact，Android 需 API 33+（RuntimeShader），用 isRuntimeShaderSupported() 门控
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.4'

    // 原版引擎源码里用到了 androidx.annotation 的 @NonNull/@Nullable 等注解，仅编译期需要
    compileOnly 'androidx.annotation:annotation:1.8.1'
}
