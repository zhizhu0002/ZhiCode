# 只跑源码结构测试。
#
# 为什么不在这里跑 gradle 构建：Android 构建需要完整 SDK + 30MB 级依赖下载，
# 在一台干净的 runner 上既慢又容易因为缓存/网络失败而变红 —— 那样没人会看它。
# 而 app/tests/ 下这组守卫只需要 JDK（java 直接跑单文件），几秒钟出结果，
# 拦的又恰好是"编译能过、但界面或行为会坏"的那一类问题。
#
# 完整构建请在本地或自建 runner 上跑：./gradlew :app:assembleDebug
name: source-tests

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 跑结构测试
        run: bash test-source-no-build.sh
