name: Android Build

on:
  push:
    branches: [main, master, feat/motion-completeness]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    env:
      # app/build.gradle reads these names when a release keystore is available.
      # They remain empty for fork PRs, which intentionally produce an unsigned
      # release artifact instead of failing before compilation.
      ZHICODE_STORE_FILE: ${{ github.workspace }}/release.keystore
      ZHICODE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ZHICODE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ZHICODE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$SDK/platforms/android-37.0"
          test -x "$SDK/build-tools/36.0.0/apksigner"
          echo "Using SDK: $SDK"
          ls -la "$SDK/platforms"
          ls -la "$SDK/build-tools/36.0.0"

      - name: Normalize local-only build settings
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          rm -f local.properties
          # Termux injects this only in the local user's Gradle properties.
          # It must never override the GitHub-hosted SDK's aapt2.
          sed -i '/^[[:space:]]*android\.aapt2FromMavenOverride[[:space:]]*=.*$/d' gradle.properties
          grep -n 'aapt2FromMavenOverride' gradle.properties && exit 1 || true
          ./gradlew --version

      - name: Prepare optional release signing
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not complete; release will be unsigned."
            exit 0
          fi
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore
          chmod 600 release.keystore
          keytool -list -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release keystore validated."

      - name: Build Debug and Release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --console=plain \
            :app:assembleDebug :app:assembleRelease

      - name: Verify signed release APK
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK="app/build/outputs/apk/release/ZhiCode-release.apk"
          APKSIGNER="$SDK/build-tools/36.0.0/apksigner"
          test -f "$APK"
          "$APKSIGNER" verify --verbose "$APK" | tee signature.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' signature.txt
          grep -Fq 'Verified using v1 scheme (JAR signing): false' signature.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): false' signature.txt
          grep -Fq 'Verified using v4 scheme (APK Signature Scheme v4): false' signature.txt
          grep -Fq 'Number of signers: 1' signature.txt
          rm -f signature.txt

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zhicode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed Release APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zhicode-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Release APK
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zhicode-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: zhicode-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14
