plugins {
    id 'com.android.application' version '9.1.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.4.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.0' apply false
}

/*
 * 这里曾经还有两个模块：`:Bcore` / `:black-reflection` / `:compiler`
 * （BlackBox 虚拟 Android 运行时的宿主层，用于「ZhiCode 沙箱」）。
 * 沙盒功能已整体移除，三个模块与它们的构建脚本一并删除。
 *
 * 删除时顺带丢掉的两样东西，都只服务于它们，别重新加回来：
 *
 * 1. **`com.android.library` 的 `apply plugin:` 变通**。
 *    当时本机离线缓存里只有 `com.android.application` 的插件 marker，
 *    没有 library 的，于是 Bcore 用传统 `apply plugin:` 绕过 marker 解析。
 *    现在没有库模块了，不需要这个技巧。
 * 2. **`ext.iqNdkVersion`**。
 *    Bcore 的原版构建脚本引用它做 ndk-build；而本机是 aarch64 + bionic，
 *    Android NDK 只发布 linux-x86_64 宿主工具链，ndk-build 会直接报
 *    Unknown host CPU architecture。所以当时就已经绕开了它（改用预编译 .so），
 *    保留该字段只是为了让原版脚本行不用改。模块没了，字段也就没了。
 *
 * 一并移除的还有 jitpack 仓库：唯一使用者是 Bcore 通过 FreeReflection 绕 hidden API 限制。
 */
